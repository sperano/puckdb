name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        # v6 installs the toolchain directive's version when go.mod has one,
        # else the go directive's exact (often .0) release.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          drift=$(gofmt -l .)
          if [ -n "$drift" ]; then
            echo "gofmt drift in:" && echo "$drift"
            exit 1
          fi
      - name: go vet
        # Run even after an earlier check fails, so one red step
        # doesn't hide the others' results.
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: staticcheck
        if: ${{ !cancelled() }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: Build
        if: ${{ !cancelled() }}
        run: go build ./...
      - name: Test
        if: ${{ !cancelled() }}
        run: go test ./...
