---
apiVersion: v1
kind: Pod
metadata:
  name: git-alpine
  labels:
    app: git-alpine
spec:
  containers:
  - name: git-alpine
    image: ericsperano/puckdb-git:latest
    #command: ["/usr/bin/git", "-C", "/mnt/puckdb-data", "status"]
    command: ["/usr/bin/tail", "-f", "/dev/null"]
    imagePullPolicy: Always
    resources:
      limits:
        memory: 512Mi
        cpu: "1"
      requests:
        memory: 256Mi
        cpu: "0.2"
    volumeMounts:
    - name: puckdb-data
      mountPath: /mnt/puckdb-data
    - name: secrets
      mountPath: /mnt/secrets
  volumes:
  - name: puckdb-data
    nfs:
      server: acidbunny.***REMOVED***
      path: "/volume1/YFHDATA"
  - name: secrets
    secret:
      secretName: puckdb
      items:
      - key: netrc
        path: netrc