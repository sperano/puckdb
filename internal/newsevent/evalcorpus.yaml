# Labeled evaluation corpus for news event extraction.
#
# Every article is synthetic: the players are fictional (NHL IDs 99000xx do
# not exist), the teams and staff are only scenery. Each case is a sequence
# of article versions; `expect` labels the events a correct extraction keeps
# for that version, `review` marks versions that must reach review, and
# `final` labels the events on record after the last version. `reply` is a
# reference reply (what a correct model answers); offline tests replay it,
# `puckdb news eval` asks the configured model instead.
#
# Change `version` whenever a label changes: evaluation runs are recorded
# per corpus version, and automatic effects need a passing run on the
# current one.
version: news-events-corpus-v1
cases:
  - id: team-suspension-indefinite
    covers: Hellebuyck-style indefinite team suspension
    description: A team suspends its starting goaltender with no length; the season's games started must not become a length.
    players:
      - {ref: P1, name: Mathis Kowalczyk, nhl_id: 9900001, team: WPG}
    steps:
      - article: wpg-kowalczyk
        publisher: NHL.com
        kind: official
        published: 2026-09-18T15:00:00Z
        title: Jets suspend goaltender Mathis Kowalczyk indefinitely
        text: >-
          The Winnipeg Jets announced that goaltender Mathis Kowalczyk has been suspended indefinitely by the
          team for violating team rules. General manager Kevin Cheveldayoff said the club would not comment
          further and gave no timetable for his return. Kowalczyk started 61 games last season.
        reply: |
          {"events": [{"player": "P1", "type": "suspension", "report_status": "confirmed",
            "attribution": "Winnipeg Jets", "effective_from": null,
            "duration": {"kind": "indefinite", "games": 0, "days": 0, "until": "",
                         "quote": "has been suspended indefinitely by the team"},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "goaltender Mathis Kowalczyk has been suspended indefinitely by the team for violating team rules"}]}]}
        expect:
          - {player: P1, type: suspension, status: confirmed, duration: indefinite}
    final:
      - {player: P1, type: suspension, status: confirmed, duration: indefinite, lifecycle: active}

  - id: fixed-length-suspension
    covers: fixed-length suspension
    description: A league suspension with a stated length and start; the injured opponent gets no invented injury.
    players:
      - {ref: P1, name: Dmitri Salo, nhl_id: 9900002, team: BUF}
      - {ref: P2, name: Owen Beckett, nhl_id: 9900003, team: DET}
    steps:
      - article: dops-salo
        publisher: NHL.com
        kind: official
        published: 2026-10-06T20:00:00Z
        title: Sabres' Dmitri Salo suspended five games for boarding
        text: >-
          Buffalo Sabres forward Dmitri Salo has been suspended for five games, without pay, for boarding
          Detroit Red Wings defenseman Owen Beckett during NHL Game No. 8 in Buffalo on Monday, Oct. 5, the NHL
          Department of Player Safety announced today. The suspension begins Oct. 7. Beckett left the game and
          did not return.
        reply: |
          {"events": [{"player": "P1", "type": "suspension", "report_status": "confirmed",
            "attribution": "NHL Department of Player Safety",
            "effective_from": {"date": "2026-10-07", "quote": "The suspension begins Oct. 7"},
            "duration": {"kind": "games", "games": 5, "days": 0, "until": "",
                         "quote": "has been suspended for five games"},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "Buffalo Sabres forward Dmitri Salo has been suspended for five games, without pay, for boarding"}]}]}
        expect:
          - {player: P1, type: suspension, status: confirmed, duration: games, games: 5, effective: "2026-10-07"}
    final:
      - {player: P1, type: suspension, status: confirmed, duration: games, games: 5, effective: "2026-10-07", lifecycle: active}

  - id: ambiguous-injury-duration
    covers: ambiguous injury duration
    description: A re-evaluation date and a missed game are not a length; the duration stays unknown.
    players:
      - {ref: P1, name: Lucas Ferreira, nhl_id: 9900004, team: TOR}
    steps:
      - article: tor-ferreira
        publisher: NHL.com
        kind: official
        published: 2026-10-12T18:00:00Z
        title: Ferreira out with lower-body injury, to be re-evaluated
        text: >-
          Toronto Maple Leafs defenseman Lucas Ferreira will miss tonight's game against Ottawa with a
          lower-body injury, coach Craig Berube said Monday morning. Berube said Ferreira will be re-evaluated
          in about a week and declined to say how long he might be out.
        reply: |
          {"events": [{"player": "P1", "type": "injury", "report_status": "confirmed",
            "attribution": "Craig Berube", "effective_from": null,
            "duration": {"kind": "unknown", "games": 0, "days": 0, "until": "", "quote": ""},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "Lucas Ferreira will miss tonight's game against Ottawa with a lower-body injury"}]}]}
        expect:
          - {player: P1, type: injury, status: confirmed, duration: unknown}
    final:
      - {player: P1, type: injury, status: confirmed, duration: unknown, lifecycle: active}

  - id: conflicting-reports
    covers: conflicting reports
    description: Two reporters give different lengths within hours; both stay on record and go to review.
    players:
      - {ref: P1, name: Anton Varga, nhl_id: 9900005, team: EDM}
    steps:
      - article: rw-varga
        publisher: RotoWire
        kind: reporting
        published: 2026-10-20T15:00:00Z
        title: "Anton Varga: Expected to miss two weeks"
        text: >-
          Varga (upper body) is expected to miss two weeks, according to Daily Faceoff's Frank Seravalli.
          The Oilers have not provided an official timeline.
        reply: |
          {"events": [{"player": "P1", "type": "injury", "report_status": "reported",
            "attribution": "Frank Seravalli", "effective_from": null,
            "duration": {"kind": "days", "games": 0, "days": 14, "until": "", "quote": "is expected to miss two weeks"},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "Varga (upper body) is expected to miss two weeks"}]}]}
        expect:
          - {player: P1, type: injury, status: reported, duration: days, days: 14}
      - article: sn-varga
        publisher: Sportsnet
        kind: reporting
        published: 2026-10-21T02:00:00Z
        title: Oilers' Varga could be out a month with upper-body injury
        text: >-
          Edmonton Oilers forward Anton Varga is expected to be out four weeks with an upper-body injury,
          sources told Sportsnet's Elliotte Friedman. The team has not commented.
        reply: |
          {"events": [{"player": "P1", "type": "injury", "report_status": "reported",
            "attribution": "Elliotte Friedman", "effective_from": null,
            "duration": {"kind": "days", "games": 0, "days": 28, "until": "", "quote": "is expected to be out four weeks"},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "Anton Varga is expected to be out four weeks with an upper-body injury"}]}]}
        expect:
          - {player: P1, type: injury, status: reported, duration: days, days: 28}
        review: true
    final:
      - {player: P1, type: injury, status: reported, duration: days, days: 14, lifecycle: active}
      - {player: P1, type: injury, status: reported, duration: days, days: 28, lifecycle: active}

  - id: trade-rumor-denied
    covers: a rumor
    description: Speculation without a destination stays a rumor with no move; the team's denial retracts it.
    players:
      - {ref: P1, name: Jesse Lindqvist, nhl_id: 9900006, team: CGY}
    steps:
      - article: sn-lindqvist-rumor
        publisher: Sportsnet
        kind: reporting
        published: 2026-11-02T14:00:00Z
        title: Flames listening to offers on Jesse Lindqvist
        text: >-
          The Calgary Flames are listening to offers on defenseman Jesse Lindqvist, according to league
          sources, and several teams have called about him. Nothing is believed to be close, and a trade could
          still be weeks away if one happens at all.
        reply: |
          {"events": [{"player": "P1", "type": "trade", "report_status": "rumor",
            "attribution": "", "effective_from": null,
            "duration": {"kind": "unknown", "games": 0, "days": 0, "until": "", "quote": ""},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "The Calgary Flames are listening to offers on defenseman Jesse Lindqvist"}]}]}
        expect:
          - {player: P1, type: trade, status: rumor}
      - article: nhl-cgy-lindqvist
        publisher: NHL.com
        kind: official
        published: 2026-11-03T18:00:00Z
        title: "Flames GM: Lindqvist is not being traded"
        text: >-
          Calgary Flames general manager Craig Conroy said Tuesday that defenseman Jesse Lindqvist is not
          being traded and called the reports untrue.
        reply: |
          {"events": [{"player": "P1", "type": "trade", "report_status": "denied",
            "attribution": "Craig Conroy", "effective_from": null,
            "duration": {"kind": "unknown", "games": 0, "days": 0, "until": "", "quote": ""},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "defenseman Jesse Lindqvist is not being traded"}]}]}
        expect:
          - {player: P1, type: trade, status: denied}
    final:
      - {player: P1, type: trade, status: rumor, lifecycle: retracted}

  - id: correction
    covers: a correction
    description: A newer version of the same article corrects a suspension to a fine; the suspension is retracted.
    players:
      - {ref: P1, name: Noah Pelletier, nhl_id: 9900007, team: MTL}
    steps:
      - article: sn-pelletier
        publisher: Sportsnet
        kind: reporting
        published: 2026-11-10T16:00:00Z
        title: Canadiens' Pelletier suspended three games
        text: >-
          Montreal Canadiens forward Noah Pelletier has been suspended three games for an illegal check to the
          head, the league announced Tuesday.
        reply: |
          {"events": [{"player": "P1", "type": "suspension", "report_status": "confirmed",
            "attribution": "", "effective_from": null,
            "duration": {"kind": "games", "games": 3, "days": 0, "until": "", "quote": "has been suspended three games"},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "Noah Pelletier has been suspended three games for an illegal check to the head"}]}]}
        expect:
          - {player: P1, type: suspension, status: confirmed, duration: games, games: 3}
      - article: sn-pelletier
        publisher: Sportsnet
        kind: reporting
        published: 2026-11-10T16:00:00Z
        title: Canadiens' Pelletier fined for illegal check
        text: >-
          Correction: An earlier version of this story incorrectly said Montreal Canadiens forward Noah
          Pelletier was suspended. Pelletier was fined $5,000, the maximum allowable under the collective
          bargaining agreement, for an illegal check to the head. He was not suspended.
        reply: |
          {"events": [{"player": "P1", "type": "suspension", "report_status": "denied",
            "attribution": "", "effective_from": null,
            "duration": {"kind": "unknown", "games": 0, "days": 0, "until": "", "quote": ""},
            "change": null,
            "evidence": [{"doc": "E1", "quote": "An earlier version of this story incorrectly said Montreal Canadiens forward Noah Pelletier was suspended"}]}]}
        expect:
          - {player: P1, type: suspension, status: denied}
    final:
      - {player: P1, type: suspension, status: confirmed, duration: games, games: 3, lifecycle: retracted}

  - id: reinstatement
