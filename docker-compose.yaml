version: '3.9'

services:
    yfh:
        build: .
        command: config
    db:
        image: postgres:14.1-alpine
        environment:
        - POSTGRES_DB=yfh
        - POSTGRES_USER=yfh
        - POSTGRES_PASSWORD=foo
        volumes:
        - ./data/db:/var/lib/postgresql/data
        ports:
        - "5432:5432"
