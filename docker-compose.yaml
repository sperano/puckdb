services:
    db:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: puckdb
            POSTGRES_USER: puckdb
            POSTGRES_PASSWORD: foo
        command: postgres -c 'max_connections=100'
        volumes:
            - ./.data/db:/var/lib/postgresql/data
        expose:
            - "5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U puckdb -d puckdb"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    pgbouncer:
        image: edoburu/pgbouncer:latest
        depends_on:
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgres://puckdb:foo@db:5432/puckdb
            POOL_MODE: transaction
            MAX_CLIENT_CONN: 1000
            DEFAULT_POOL_SIZE: 20
            MIN_POOL_SIZE: 5
            RESERVE_POOL_SIZE: 5
            AUTH_TYPE: plain
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432", "-U", "puckdb"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    postgresql:
        container_name: temporal-postgresql
        image: postgres:${POSTGRESQL_VERSION:-16-alpine}
        environment:
            POSTGRES_PASSWORD: temporal
            POSTGRES_USER: temporal
        volumes:
            - ./.data/temporal-db:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U temporal"]
            interval: 5s
            timeout: 5s
            retries: 5
        deploy:
            resources:
                limits:
                    memory: 512M
        restart: unless-stopped

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        command: redis-server --appendonly yes --requirepass redis
        volumes:
            - ./.data/redis:/data
        healthcheck:
            test: ["CMD", "redis-cli", "-a", "redis", "ping"]
            interval: 5s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    temporal:
        container_name: temporal
        depends_on:
            postgresql:
                condition: service_healthy
        environment:
            - DB=postgresql
            - DB_PORT=5432
            - POSTGRES_USER=temporal
            - POSTGRES_PWD=temporal
            - POSTGRES_SEEDS=postgresql
            - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
        image: temporalio/auto-setup:${TEMPORAL_VERSION:-1.25.2}
        ports:
            - "7233:7233"
        volumes:
            - ./.docker/temporal-config:/etc/temporal/config/dynamicconfig
        healthcheck:
            test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
            interval: 10s
            timeout: 5s
            retries: 10
            start_period: 30s
        deploy:
            resources:
                limits:
                    memory: 2G
                reservations:
                    memory: 1G
        restart: unless-stopped

    temporal-admin-tools:
        container_name: temporal-admin-tools
        depends_on:
            temporal:
                condition: service_healthy
        environment:
            - TEMPORAL_CLI_ADDRESS=temporal:7233
        image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.25.2}
        stdin_open: true
        tty: true

    temporal-ui:
        container_name: temporal-ui
        depends_on:
            temporal:
                condition: service_healthy
        environment:
            - TEMPORAL_ADDRESS=temporal:7233
            - TEMPORAL_CORS_ORIGINS=http://localhost:3000
            - TEMPORAL_NOTIFY_ON_NEW_VERSION=false
        image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.32.0}
        ports:
            - "8080:8080"
        restart: unless-stopped

    grafana:
        image: grafana/grafana:latest
        ports:
            - "3001:3000"
        environment:
            - GF_AUTH_ANONYMOUS_ENABLED=true
            - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
            - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/puckdb-dashboard.json
        volumes:
            - ./.docker/grafana/provisioning:/etc/grafana/provisioning
            - ../../grafana/dashboards:/var/lib/grafana/dashboards
        restart: unless-stopped
